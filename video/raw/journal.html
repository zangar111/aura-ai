<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Journal scene</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #e9edf2; }
  body { font-family: "Liberation Sans", Arial, sans-serif; font-size: 12px; color: #222; }
  #cam { position: absolute; left: 0; top: 0; width: 2200px; transform-origin: 0 0; }
  .topbar { height: 46px; background: #2f4f7a; color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 26px; font-size: 14px; }
  .topbar b { font-size: 16px; letter-spacing: 0.3px; }
  .topbar span { opacity: 0.85; }
  .crumbs { padding: 12px 20px; color: #5a6b80; font-size: 13px; }
  h1 { font-size: 19px; font-weight: 600; padding: 0 20px 10px; color: #26374d; }
  .filters { padding: 0 20px 12px; display: flex; gap: 10px; }
  .filters div { background: #fff; border: 1px solid #c8d1dc; border-radius: 3px; padding: 6px 10px; color: #444; }
  table { border-collapse: collapse; margin: 0 20px; background: #fff; }
  th, td { border: 1px solid #cfd6df; padding: 6px 7px; text-align: center; white-space: nowrap; min-width: 38px; }
  th { background: #f1f4f8; font-weight: 600; color: #34465c; font-size: 11px; }
  td.subj { text-align: left; min-width: 230px; font-weight: 600; }
  td.grp { color: #5a6b80; min-width: 92px; }
  td.np { color: #c33; font-weight: 600; }
  td.tot { background: #fbf7e8; font-weight: 600; }
  th.tot { background: #f3ecd2; }
  td.empty { color: #b9c2cc; }
  #cursor { position: absolute; z-index: 5; width: 22px; height: 22px; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="cam">
  <div class="topbar"><b>Электронный журнал</b><span>Главная</span><span>Расписание</span><span>Журнал успеваемости</span><span>Сообщения</span></div>
  <div class="crumbs">Главная › Обучение › Журнал успеваемости</div>
  <h1>Журнал успеваемости · 2026–2027 · 1 семестр</h1>
  <div class="filters"><div>Учебный год: 2026–2027</div><div>Семестр: 1</div><div>Тип: все</div><div>Показать: все дисциплины ▾</div></div>
  <table id="table"></table>
</div>
<svg id="cursor" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.5 14 L10.5 20.5 L13 19.4 L10.1 13 L16 13 Z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
<script>
const COLS = [...Array.from({ length: 15 }, (_, i) => String(i + 1)),
  "ТК1", "РК1", "Р1", "ТК2", "РК2", "Р2", "ТК ОБЩ.", "Рейтинг допуска", "Итоговый контроль", "Итог. оценка (%)", "Итог. оценка (Букв.)"];
const TYPE = { L: "Лекция", Lab: "Лабораторная", SRO: "СРО", Pr: "Практика" };
const table = document.getElementById("table");
let html = "<tr><th>Дисциплина</th><th>Поток</th>" + COLS.map((c) => `<th class="${/^\d+$/.test(c) ? "" : "tot"}">${c}</th>`).join("") + "</tr>";
for (const row of window.GRADES) {
  const type = row.stream.split("-").pop();
  html += `<tr><td class="subj">${row.subject}<br><span style="font-weight:400;color:#5a6b80">${TYPE[type] || type}</span></td><td class="grp">${row.stream}</td>`;
  for (const c of COLS) {
    const v = row.marks[c] || "";
    const cls = v === "н.п." ? "np" : !v ? "empty" : /^\d+$/.test(c) ? "" : "tot";
    html += `<td class="${cls}">${v || "–"}</td>`;
  }
  html += "</tr>";
}
table.innerHTML = html;

const cam = document.getElementById("cam");
const cursor = document.getElementById("cursor");
const clamp = (v) => Math.min(1, Math.max(0, v));
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const lerp = (a, b, p) => a + (b - a) * p;

// Ключевые кадры камеры: [мс, x, y, масштаб] и курсора: [мс, x, y]
const CAM = [[0, 0, 0, 1], [2500, 0, 0, 1], [7500, 600, 60, 1.35], [11000, 980, 60, 1.35], [14500, 820, 0, 1], [18000, 820, 0, 1]];
const CUR = [[0, 640, 560], [2500, 520, 330], [5000, 760, 300], [8000, 980, 360], [10500, 1010, 260], [13000, 700, 420], [18000, 640, 430]];

function at(keys, t) {
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, ...a] = keys[i], [t1, ...b] = keys[i + 1];
    if (t <= t1) { const p = ease(clamp((t - t0) / (t1 - t0))); return a.map((v, k) => lerp(v, b[k], p)); }
  }
  return keys[keys.length - 1].slice(1);
}

window.SCENE_DURATION = 18000;
window.renderAt = (t) => {
  const [x, y, s] = at(CAM, t);
  cam.style.transform = `scale(${s}) translate(${-x}px, ${-y}px)`;
  const [cx, cy] = at(CUR, t);
  cursor.style.left = cx + "px";
  cursor.style.top = cy + "px";
};
window.ready = document.fonts.ready;
</script>
</body>
</html>
