<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Aura logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 600px; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; gap: 48px; font-family: "Inter Display", "Inter", sans-serif; }
  .orb {
    width: 260px; height: 260px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 32% 26%, #e4d4ff 0%, #9b6bff 32%, #5a2fe0 62%, #23106e 100%);
    box-shadow: inset 0 -18px 40px rgba(0,0,0,0.35);
    color: #fff; font-weight: 900; font-size: 150px; letter-spacing: -6px;
  }
  .orb span { transform: translateY(-4px); text-shadow: 0 6px 24px rgba(30,10,90,0.6); }
  .word { color: #fff; font-weight: 800; font-size: 190px; letter-spacing: -8px; line-height: 1; }
  .word i { font-style: normal; background: linear-gradient(90deg, #c9a7ff, #b6ff5c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  body.icon .word { display: none; }
  body.icon { width: 600px; }
</style>
</head>
<body>
  <div class="orb"><span>A</span></div>
  <div class="word">Aur<i>a</i></div>
<script>
  if (location.search.includes("icon")) document.body.classList.add("icon");
  window.SCENE_DURATION = 0;
  window.renderAt = () => {};
  window.ready = document.fonts.ready;
</script>
</body>
</html>
